<!doctype html>
<html lang="en">
  <head>
    <title>Ditya Tools - Simple Online Utilities</title>
    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <meta
      name="description"
      content="Ditya Tools is a collection of simple, privacy-focused utilities for images, PDFs, media, QR codes, and everyday tasks."
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#38BDF8"
    />

    <meta
      name="application-name"
      content="Ditya Tools"
    />


    <!-- Open Graph -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Ditya Tools"
    />

    <meta
      property="og:description"
      content="No ads. No clutter. Just tools."
    />


    <!-- Twitter / social preview -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Ditya Tools"
    />

    <meta
      name="twitter:description"
      content="No ads. No clutter. Just tools."
    />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ditya Tools",
      "applicationCategory": "UtilitiesApplication",
      "description": "A collection of simple, privacy-focused utilities for images, PDFs, media, QR codes, and everyday tasks.",
      "operatingSystem": "Any"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
